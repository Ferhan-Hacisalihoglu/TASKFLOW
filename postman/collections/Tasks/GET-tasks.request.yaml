$kind: http-request
name: GET /tasks
method: GET
url: '{{baseUrl}}/tasks'
scripts:
  - type: afterResponse
    language: text/javascript
    code:
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('returns array', () => pm.expect(pm.response.json().data).to.be.an('array'));
