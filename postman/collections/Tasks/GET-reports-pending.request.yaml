$kind: http-request
name: GET /reports/pending
method: GET
url: 'http://localhost:3000/reports/pending'
scripts:
  - type: afterResponse
    language: text/javascript
    code:
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('report is pending_tasks', () => pm.expect(pm.response.json().report).to.equal('pending_tasks'));
