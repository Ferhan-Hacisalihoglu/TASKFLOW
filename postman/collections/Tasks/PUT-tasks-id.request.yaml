$kind: http-request
name: PUT /tasks/:id
method: PUT
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |
    {
      "status": "completed"
    }
url: '{{baseUrl}}/tasks/1'
scripts:
  - type: afterResponse
    language: text/javascript
    code:
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('status updated', () => pm.expect(pm.response.json().data.status).to.equal('completed'));
