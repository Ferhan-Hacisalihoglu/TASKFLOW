$kind: http-request
name: GET /
method: GET
url: 'http://localhost:3000/'
scripts:
  - type: afterResponse
    language: text/javascript
    code:
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('running message', () => pm.expect(pm.response.json().message).to.include('running'));
