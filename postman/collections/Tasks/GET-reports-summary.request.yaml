$kind: http-request
name: GET /reports/summary
method: GET
url: '{{baseUrl}}/reports/summary'
scripts:
  - type: afterResponse
    language: text/javascript
    code:
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('has total', () => pm.expect(pm.response.json().data).to.have.property('total'));
