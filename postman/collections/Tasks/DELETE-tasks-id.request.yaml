$kind: http-request
name: 'DELETE /tasks/:id'
method: DELETE
url: 'http://localhost:3000/tasks/5'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('message contains deleted', () => pm.expect(pm.response.json().message).to.include('deleted'));
