$kind: http-request
name: GET /tasks/:id
method: GET
url: 'http://localhost:3000/tasks/1'
scripts:
  - type: afterResponse
    language: text/javascript
    code:
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('has id', () => pm.expect(pm.response.json().data).to.have.property('id'));
